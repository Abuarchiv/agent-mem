name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download pinned models
        run: npm run models:download
      - name: Download pinned Node runtime
        run: npm run runtime:download
      - name: Build
        run: npm run build
      - name: Prepare private Windows temp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $privateTemp = Join-Path $env:RUNNER_TEMP "agent-memory-v1-private-temp"
          New-Item -ItemType Directory -Force -Path $privateTemp | Out-Null
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $user = [System.Security.Principal.SecurityIdentifier]::new($userSid)
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($user)
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($sid in @($userSid, "S-1-5-18", "S-1-5-32-544")) {
            $identity = [System.Security.Principal.SecurityIdentifier]::new($sid)
            $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
              $identity,
              [System.Security.AccessControl.FileSystemRights]::FullControl,
              [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit,
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow)
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $privateTemp -AclObject $acl
          "TEMP=$privateTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$privateTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build and smoke-test core package
        shell: bash
        run: |
          npm run package -- --output "$RUNNER_TEMP/agent-memory-v1-core-package"
          npm run probe -- --package-dir "$RUNNER_TEMP/agent-memory-v1-core-package" --no-rerank
      - name: Build and smoke-test full package
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm run package -- --output "$RUNNER_TEMP/agent-memory-v1-full-package" --with-reranker
          npm run probe -- --package-dir "$RUNNER_TEMP/agent-memory-v1-full-package"
