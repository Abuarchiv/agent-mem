name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-extras --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Smoke test installed wheel
        shell: bash
        env:
          AGENT_MEM_DATA_DIR: ${{ runner.temp }}/agent-mem-smoke
          AGENT_MEM_NO_SPAWN: "1"
        run: |
          uv tool install dist/*.whl
          agent-mem --version
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"'"$PWD"'","prompt":"ci smoke"}' | agent-mem hook claude
          agent-mem status --json
          agent-mem doctor || true

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Build the source distribution
        run: uv build --sdist
      - name: Run the tests from the unpacked sdist
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/agent_mem-*
          uv venv
          uv pip install ".[semantic]" pytest
          .venv/bin/python -m pytest -p no:cacheprovider

  opencode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Type-check the OpenCode plugin against its SDK
        working-directory: plugins/opencode
        run: |
          npm install --no-save --no-audit --no-fund @opencode-ai/plugin@^1.18 typescript@^7 @types/node@^24
          npx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext \
            --skipLibCheck --types node agent-mem.ts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Audit dependencies
        shell: bash
        run: uvx pip-audit --strict -r <(uv export --no-dev --no-hashes --no-emit-project --all-extras --locked)
