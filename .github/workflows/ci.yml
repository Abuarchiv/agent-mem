name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-extras --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -m "not local"
      - name: Build
        run: uv build
      - name: Smoke test installed wheel
        shell: bash
        env:
          AGENT_MEM_DATA_DIR: ${{ runner.temp }}/agent-mem-smoke
          AGENT_MEM_NO_SPAWN: "1"
        run: |
          uv tool install dist/*.whl
          agent-mem --version
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"'"$PWD"'","prompt":"ci smoke"}' | agent-mem hook claude
          agent-mem status --json
          agent-mem doctor || true
      - name: Run the hook command setup writes, as Claude Code does (Git Bash on Windows)
        shell: bash
        env:
          AGENT_MEM_DATA_DIR: ${{ runner.temp }}/agent-mem-setup
          AGENT_MEM_NO_SPAWN: "1"
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          agent-mem setup claude --write --no-models
          command=$(grep -o '"command": "[^"]*hook claude"' "$CLAUDE_CONFIG_DIR/settings.json" | head -1 | sed 's/^"command": "//; s/"$//')
          echo "$command"
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"setup","cwd":"'"$PWD"'","prompt":"setup smoke"}' | bash -c "$command"
          agent-mem status --json | grep -q '"turns": 1,'
      - name: agent-mem upgrade while an open session's MCP server runs (Windows locks a running .exe)
        shell: bash
        env:
          AGENT_MEM_DATA_DIR: ${{ runner.temp }}/agent-mem-setup
          AGENT_MEM_NO_SPAWN: "1"
        run: |
          uv tool install .
          sleep 300 | agent-mem mcp > /dev/null &
          sleep 5
          sed -i 's/^version = "1.0.0"/version = "1.0.1"/' pyproject.toml
          sed -i 's/^__version__ = "1.0.0"/__version__ = "1.0.1"/' src/agent_mem/__init__.py
          agent-mem upgrade || true  # doctor --fix at its end finds no agent on the runner
          agent-mem --version | grep -q 1.0.1

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Build the source distribution
        run: uv build --sdist
      - name: Run the tests from the unpacked sdist
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/agent_mem-*
          uv venv
          # the observer tests need mem0 and the spaCy model it loads, as in the dev group
          uv pip install ".[semantic,observer]" pytest \
            "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          .venv/bin/python -m pytest -p no:cacheprovider -m "not local"

  opencode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Type-check the OpenCode plugin against its SDK
        working-directory: plugins/opencode
        run: |
          npm install --no-save --no-audit --no-fund @opencode-ai/plugin@^1.18 typescript@^7 @types/node@^24
          npx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext \
            --skipLibCheck --types node agent-mem.ts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Audit dependencies
        shell: bash
        # pillow comes only with fastembed (<13 up to 0.9.0) and decodes images; agent-mem embeds text only.
        # Audit it again once fastembed allows pillow 13. --no-deps: the export already lists every locked package.
        run: uvx pip-audit --strict --disable-pip --no-deps -r <(uv export --no-dev --no-hashes --no-emit-project --all-extras --locked | grep -v '^pillow==')

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Type-check the viewer
        run: |
          npm install --no-save --no-audit --no-fund typescript@7.0.2
          npx tsc -p src/agent_mem/ui
