name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download pinned models
        run: npm run models:download
      - name: Download pinned Node runtime
        run: npm run runtime:download
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build and smoke-test package
        shell: bash
        run: |
          npm run package -- --output "$RUNNER_TEMP/agent-memory-v1-package"
          npm run probe -- --package-dir "$RUNNER_TEMP/agent-memory-v1-package" --no-rerank
