name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and verify pinned models
        run: |
          npm run models:download
          npm run models:verify

      - name: Run full test suite
        run: npm test

      - name: Build package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/agent-memory-v1-package"
          npm run package -- --output "$package_dir"
          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Build package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "agent-memory-v1-package"
          npm run package -- --output $packageDir
          "PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Check packaged launcher (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: "$PACKAGE_DIR/memory help"

      - name: Check packaged launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PACKAGE_DIR\memory.cmd" help'

      - name: Run packaged retrieval probe (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/v1-retrieval-probe.mjs --package-dir "$PACKAGE_DIR" --no-rerank

      - name: Run packaged retrieval probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/v1-retrieval-probe.mjs --package-dir "$env:PACKAGE_DIR" --no-rerank
