name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and verify pinned models
        run: |
          npm run models:download:all
          npm run models:verify:all

      - name: Run full test suite (Unix)
        if: runner.os != 'Windows'
        run: npm test

      - name: Run Windows build and platform gates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run build
          node --test --test-timeout=120000 dist-v1/tests/v1-platform.test.js dist-v1/tests/v1-installer.test.js

      - name: Build package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/agent-mem-package"
          npm run package -- --output "$package_dir" --with-reranker
          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Harden Windows model asset ACLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelRoot = Join-Path (Get-Location) ".models\e5\Xenova\multilingual-e5-small\761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $paths = @($modelRoot) + @(Get-ChildItem -LiteralPath $modelRoot -Recurse -Force | ForEach-Object { $_.FullName })
          foreach ($path in $paths) {
            $permission = (Get-Item -LiteralPath $path).PSIsContainer ? "(OI)(CI)F" : "F"
            icacls.exe $path /setowner "*${userSid}" /C
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            icacls.exe $path /inheritance:r /grant:r "*${userSid}:$permission" "*S-1-5-18:$permission" "*S-1-5-32-544:$permission" /C
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify Windows model assets through Node
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelRoot = Join-Path (Get-Location) ".models\e5\Xenova\multilingual-e5-small\761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          node --input-type=module -e 'import { assertPrivatePath } from "./dist-v1/src/v1/private-files.js"; try { assertPrivatePath(process.argv[1], undefined, "model_asset_unverified", "asset"); console.log("model_asset_ok"); } catch (error) { const cause = error?.cause; const nested = cause?.cause; console.error(JSON.stringify({ message: error?.message, cause: cause?.message, nestedCause: nested?.message, stderr: nested?.stderr?.toString() })); process.exit(1); }' -- "$modelRoot"

      - name: Build package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "agent-mem-package"
          npm run package -- --output $packageDir --with-reranker
          "PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Check packaged launcher (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: "$PACKAGE_DIR/agent-mem help"

      - name: Check packaged launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PACKAGE_DIR\agent-mem.cmd" help'

      - name: Run packaged retrieval probe (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/v1-retrieval-probe.mjs --package-dir "$PACKAGE_DIR"
      - name: Run packaged retrieval probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/v1-retrieval-probe.mjs --package-dir "$env:PACKAGE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
