name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and verify pinned models
        run: |
          npm run models:download
          npm run models:verify

      - name: Run full test suite (Unix)
        if: runner.os != 'Windows'
        run: npm test

      - name: Run Windows build and platform gates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run build
          node --test --test-timeout=120000 dist-v1/tests/v1-platform.test.js dist-v1/tests/v1-installer.test.js

      - name: Build package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/agent-mem-package"
          npm run package -- --output "$package_dir"
          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Harden Windows model asset ACLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelRoot = Join-Path (Get-Location) ".models\e5\Xenova\multilingual-e5-small\761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls.exe $modelRoot /inheritance:r /grant:r "*${userSid}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" /T /C
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report Windows model asset ACL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelRoot = Join-Path (Get-Location) ".models\e5\Xenova\multilingual-e5-small\761b726dd34fb83930e26aab4e9ac3899aa1fa78"
          $acl = Get-Acl -LiteralPath $modelRoot
          $sidType = [System.Security.Principal.SecurityIdentifier]
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $rules = @($acl.GetAccessRules($true, $true, $sidType) | ForEach-Object {
            @{ sid = $_.IdentityReference.Value; allow = ($_.AccessControlType -eq 'Allow'); rights = [int]$_.FileSystemRights; inheritOnly = (($_.PropagationFlags -band 2) -ne 0) }
          })
          @{ owner = $acl.GetOwner($sidType).Value; user = $user.Value; rules = $rules } | ConvertTo-Json -Depth 4 -Compress

      - name: Build package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "agent-mem-package"
          npm run package -- --output $packageDir
          "PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Check packaged launcher (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: "$PACKAGE_DIR/agent-mem help"

      - name: Check packaged launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PACKAGE_DIR\agent-mem.cmd" help'

      - name: Run packaged retrieval probe (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/v1-retrieval-probe.mjs --package-dir "$PACKAGE_DIR" --no-rerank
