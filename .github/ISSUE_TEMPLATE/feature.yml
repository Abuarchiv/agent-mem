name: Feature request
description: Something agent-mem should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: Claude Code / Codex / Copilot CLI / OpenCode
