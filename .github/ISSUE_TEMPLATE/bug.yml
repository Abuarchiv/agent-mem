name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agent-mem doctor --json`
      description: Paste it as is. It contains no prompt text, only component states and paths.
      render: json
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Last 50 lines of the log
      description: "`agent-mem paths` names the log folder; paste the end of `hook.log` there. Logs never contain what you typed."
      render: text
  - type: input
    id: harness
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x / Codex CLI 0.x / Copilot CLI 1.x / OpenCode 1.19 or 2.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python
      placeholder: macOS 15 arm64, Python 3.13 (uv)
