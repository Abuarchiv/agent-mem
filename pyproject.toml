[project]
name = "agent-mem"
version = "1.0.0"
description = "Local, self-learning memory shared by Claude Code, Codex, Copilot CLI and OpenCode. No LLM calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Abuarchiv" }]
keywords = ["memory", "agents", "mcp", "claude-code", "codex", "copilot", "opencode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
# The hook path imports only the standard library. These dependencies are
# loaded lazily by the MCP server, the indexer and the CLI.
dependencies = [
  "mcp>=2.2,<3",
  "numpy>=2.0",
  "dateparser>=1.2.1",
  "filelock>=3.16",
]

[project.optional-dependencies]
# Semantic search with the multilingual E5 model (ONNX, no PyTorch). ONNX Runtime publishes no
# wheels for Intel Macs; there the extra installs nothing and search stays lexical + graph.
semantic = ["fastembed>=0.8; sys_platform != 'darwin' or platform_machine != 'x86_64'"]
# Background observer (docs/PLAN.md §4.5): mem0 does extraction and dedup, Qdrant is the local
# vector store. Pinned; upgrades only with a green adapter test. Imported lazily by observe/ only.
observer = ["mem0ai[nlp]==2.2.1", "qdrant-client>=1.12", "ollama>=0.4"]

[project.scripts]
agent-mem = "agent_mem.cli:main"

[project.urls]
Homepage = "https://github.com/Abuarchiv/agent-mem"
Issues = "https://github.com/Abuarchiv/agent-mem/issues"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mem"]

[tool.hatch.build.targets.wheel.force-include]
"plugins" = "agent_mem/plugins"

[tool.hatch.build.targets.sdist]
include = ["src/agent_mem", "tests", "plugins", ".claude-plugin", ".agents", ".github/plugin", "README.md", "ARCHITECTURE.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.16",
  "pyright>=1.1.414",
  # mem0's entity linking loads this spaCy model and otherwise pip-installs it at runtime into the
  # active environment (mem0/utils/spacy_models.py). Declared here so `uv sync` keeps it and no
  # run ever modifies the venv. `agent-mem setup` installs it for end users (PLAN.md §14, I4).
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  "PLC0415",  # lazy imports keep the hook path free of heavy dependencies
  "E501",     # the formatter wraps code; long SQL literals stay readable on one line
  "PLW2901",
  "S603", "S607", "S608", "S101", "S310",
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
