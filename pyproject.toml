[project]
name = "agent-mem"
dynamic = ["version"]
description = "Shared, local memory for Claude Code, Codex, Copilot CLI and OpenCode. Facts are extracted in the background through the harness you already use (no API key); no cloud, no telemetry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Abuarchiv" }]
keywords = ["memory", "agents", "mcp", "claude-code", "codex", "copilot", "opencode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
# The hook path imports only the standard library. These dependencies are
# loaded lazily by the MCP server, the indexer and the CLI.
dependencies = [
  "mcp>=2.2,<3",
  "numpy>=2.0",
  "dateparser>=1.2.1",
  "filelock>=4.2.1",  # 4.1 and older: CVE-2026-112907 and four more
]

[project.optional-dependencies]
# Search by meaning with a multilingual MiniLM model (ONNX, no PyTorch). ONNX Runtime publishes no
# wheels for Intel Macs; there the extra installs nothing and search stays lexical + graph.
semantic = ["fastembed>=0.8; sys_platform != 'darwin' or platform_machine != 'x86_64'"]
# Background observer: mem0 does extraction and dedup, Qdrant is the local
# vector store. Pinned; upgrades only with a green adapter test. Imported lazily by observe/ only.
observer = ["mem0ai[nlp]==2.2.1", "qdrant-client>=1.12", "ollama>=0.4"]

[project.scripts]
agent-mem = "agent_mem.cli:main"

[project.urls]
Homepage = "https://github.com/Abuarchiv/agent-mem"
Documentation = "https://abuarchiv.github.io/agent-mem-docs/"
Issues = "https://github.com/Abuarchiv/agent-mem/issues"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_mem/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mem"]
# The wheel ships the viewer script built from ui/app.ts (hatch_build.py); the TypeScript source stays in the sdist.
exclude = ["src/agent_mem/ui/app.ts", "src/agent_mem/ui/tsconfig.json"]

[tool.hatch.build.targets.wheel.hooks.custom]
dependencies = ["nodejs-wheel-binaries==24.19.0"]

[tool.hatch.build.targets.wheel.force-include]
"plugins" = "agent_mem/plugins"

[tool.hatch.build.targets.sdist]
include = ["src/agent_mem", "tests", "plugins", "hatch_build.py", "install.sh", "install.ps1", ".claude-plugin", ".agents", ".github/plugin", ".githooks", "README.md", "ARCHITECTURE.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.uv]
# Installed from a folder (`uv tool install ./agent-mem`), uv rebuilds only when a cache key changes; its default
# looks at pyproject.toml and the mtime of src/ itself, which an edit below it never moves. A new commit rebuilds.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { git = { commit = true } }]

[dependency-groups]
dev = [
  # the tests build the viewer script from ui/app.ts the way a wheel build does (hatch_build.py)
  "hatchling>=1.32",
  "nodejs-wheel-binaries==24.19.0",
  "pytest>=9.1",
  "ruff>=0.16",
  "pyright>=1.1.414",
  # mem0's entity linking loads this spaCy model and otherwise pip-installs it at runtime into the
  # active environment (mem0/utils/spacy_models.py). Declared here so `uv sync` keeps it and no
  # run ever modifies the venv. `agent-mem setup` installs it for end users.
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "local: needs the observer extra and a cached embedding model; run by hand, not in CI",
]
addopts = "-q -m 'not local'"  # `-m local` runs them by hand
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C90"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  "PLC0415",  # lazy imports keep the hook path free of heavy dependencies
  "E501",     # the formatter wraps code; long SQL literals stay readable on one line
  "PLW2901",
  "S603", "S607", "S608", "S101", "S310",
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
# The most complex function today; lower it when one of them is split, never raise it.
max-complexity = 17

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
# From strict: bare `dict` or `list` and untyped parameters hide what a function takes.
reportMissingTypeArgument = "error"
reportMissingParameterType = "error"
